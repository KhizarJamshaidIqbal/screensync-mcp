<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScreenSync MCP header (embed)</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#6541D6">
<!-- Embed for the CBM blog at /blogs/ (iframe #ss-header). Links open in the top window. -->
<base target="_top">
<link rel="icon" type="image/png" href="https://www.screensyncmcp.tech/assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --brand:#6541D6; --brand-2:#7E5BE6; --ink:#150E27; --text:#1E1633; --body:#4B4460; --line:rgba(101,65,214,.10); }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  a:focus-visible { outline: 3px solid #B39DF3; outline-offset: 3px; border-radius: 10px; }
  svg { display: block; flex: none; }

  /* Exactly 64px tall (border included) so the parent's default iframe height matches. */
  #ss-embed-root { height: 64px; background: rgba(255,255,255,.97); border-bottom: 1px solid var(--line); }
  .ss-h { max-width: 1280px; height: 100%; margin: 0 auto; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }

  .ss-brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 0 1 auto; }
  .ss-brand img { width: 36px; height: 36px; border-radius: 12px; box-shadow: 0 4px 12px rgba(101,65,214,.22); }
  .ss-brand-text { min-width: 0; font-size: 18px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grad { background: linear-gradient(100deg, #6541D6 10%, #8B6AEC 60%, #B39DF3 95%); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .ss-nav { display: flex; align-items: center; gap: 22px; flex: none; font-size: 15px; font-weight: 500; color: var(--body); white-space: nowrap; }
  .ss-l { position: relative; padding: 6px 0; transition: color .2s ease; }
  .ss-l:hover { color: var(--brand); }
  .ss-l[aria-current="page"] { color: var(--brand); font-weight: 700; }
  .ss-l[aria-current="page"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; border-radius: 2px; background: linear-gradient(90deg, #6541D6, #B39DF3); }

  .ss-btn { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 20px; border-radius: 999px; font-size: 14px; font-weight: 600; white-space: nowrap; transition: transform .3s ease, box-shadow .3s ease, border-color .3s ease, background .3s ease; }
  .ss-btn svg { width: 16px; height: 16px; }
  .ss-btn-primary { background: linear-gradient(135deg, #6541D6, #7E5BE6); color: #fff; box-shadow: 0 3px 10px rgba(101,65,214,.32); }
  .ss-btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(101,65,214,.42); }
  .ss-btn-secondary { background: #fff; color: var(--brand); border: 1.5px solid #E3DBF8; }
  .ss-btn-secondary:hover { border-color: var(--brand); background: #FBFAFE; }

  /* Narrow-only items stay hidden on wide screens. */
  .ss-sm { display: none; }

  /* 960-1239: drop the long tail of links and the secondary button. */
  @media (max-width: 1239px) {
    .ss-xl { display: none; }
    .ss-nav { gap: 20px; }
  }
  /* Under 960: no dropdown inside an iframe. Logo + Blog + Get the app only. */
  @media (max-width: 959px) {
    .ss-lg { display: none; }
    .ss-sm { display: inline-flex; }
    .ss-nav { gap: 16px; }
  }
  @media (max-width: 640px) {
    .ss-h { padding: 0 16px; gap: 12px; }
    .ss-brand-text { font-size: 16px; }
    .ss-btn { padding: 0 14px; font-size: 13px; }
    .ss-nav { gap: 12px; font-size: 14px; }
  }
  @media (max-width: 400px) {
    .ss-h { padding: 0 14px; }
    .ss-btn svg { display: none; }
    .ss-brand img { width: 32px; height: 32px; border-radius: 10px; }
    .ss-brand-text { font-size: 15px; }
  }
  @media (max-width: 340px) {
    .ss-brand-text { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ss-btn, .ss-l { transition: none; }
  }
</style>
</head>
<body>
<div id="ss-embed-root">
  <header class="ss-h">
    <a class="ss-brand" href="https://www.screensyncmcp.tech/" aria-label="ScreenSync MCP home">
      <img src="https://www.screensyncmcp.tech/assets/logo-72.webp" srcset="https://www.screensyncmcp.tech/assets/logo-72.webp 1x, https://www.screensyncmcp.tech/assets/logo-144.webp 2x" alt="" width="36" height="36">
      <span class="ss-brand-text">ScreenSync <span class="grad">MCP</span></span>
    </a>
    <nav class="ss-nav" aria-label="Main">
      <a class="ss-l ss-lg" href="https://www.screensyncmcp.tech/">Home</a>
      <a class="ss-l ss-lg" href="https://www.screensyncmcp.tech/screen-mcp.html">Screen MCP</a>
      <a class="ss-l ss-lg" href="https://www.screensyncmcp.tech/setup.html">Setup</a>
      <a class="ss-l ss-lg" href="https://www.screensyncmcp.tech/extension.html">Extension</a>
      <a class="ss-l ss-xl" href="https://www.screensyncmcp.tech/changelog.html">Changelog</a>
      <a class="ss-l" href="https://www.screensyncmcp.tech/blogs/" aria-current="page">Blog</a>
      <a class="ss-btn ss-btn-secondary ss-xl" href="https://play.google.com/store/apps/details?id=com.screensync.mcp" target="_blank" rel="noopener" title="Get it on Google Play">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>
        Get App
      </a>
      <a class="ss-btn ss-btn-primary ss-lg" href="https://www.screensyncmcp.tech/#connect">Get Connected</a>
      <a class="ss-btn ss-btn-primary ss-sm" href="https://play.google.com/store/apps/details?id=com.screensync.mcp" target="_blank" rel="noopener" title="Get it on Google Play">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>
        Get the app
      </a>
    </nav>
  </header>
</div>
<script>
/* Tell the parent page how tall this embed is.
   Message: { type: 'screensync-embed-height', embed: 'header', height: <px> }
   The parent can ask again with { type: 'screensync-embed-ping' }. */
(function () {
  'use strict';
  var KIND = 'header';
  var root = document.getElementById('ss-embed-root');
  if (!root || window.parent === window) return;
  var last = 0, raf = 0;
  function post(force) {
    var h = Math.ceil(root.getBoundingClientRect().height);
    if (!h || (!force && h === last)) return;
    last = h;
    try { window.parent.postMessage({ type: 'screensync-embed-height', embed: KIND, height: h }, '*'); } catch (e) {}
  }
  function queue() {
    if (raf) return;
    raf = window.requestAnimationFrame(function () { raf = 0; post(false); });
  }
  post(true);
  window.addEventListener('load', function () { post(true); });
  window.addEventListener('resize', queue);
  if (window.ResizeObserver) new ResizeObserver(queue).observe(root);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { post(true); });
  window.addEventListener('message', function (e) {
    if (e.source === window.parent && e.data && e.data.type === 'screensync-embed-ping') post(true);
  });
})();
</script>
</body>
</html>
