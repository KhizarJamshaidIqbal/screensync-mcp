name: screensync_flutter_project
description: ScreenSync MCP — Floating bubble screen capture with LAN/Google Drive sync.
publish_to: 'none'
version: 2.5.0+25

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Overlay bubble
  flutter_overlay_window: ^0.4.5

  # Google Drive BYOS
  google_sign_in: ^6.1.6
  googleapis: ^12.0.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  http: ^1.2.2

  # Enterprise upgrade: sensors / storage / discovery / visuals
  sensors_plus: ^6.1.1            # shake-to-capture accelerometer stream
  bonsoir: ^5.1.11                # mDNS/Bonjour hub discovery on LAN
  path_provider: ^2.1.5           # pending-snap import & thumbnails dir
  shared_preferences: ^2.3.4      # durable settings
  sqflite: ^2.4.1                 # local SQLite capture history cache
  flutter_animate: ^4.5.2         # entry/motion effects
  image: ^4.5.2                   # JPEG encode for low-latency preset
  meta: ^1.17.0                   # @visibleForTesting annotations
  mobile_scanner: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
