<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles/brand.css">
  <link rel="stylesheet" href="../styles/components.css">
</head>
<body class="popup">
<div class="pop">
  <!-- 1. Header: Logo + Status Pill -->
  <div class="pop-header">
    <div class="pop-logo">
      <img src="../icons/icon32.png" alt="" width="22" height="22">
      <strong>ScreenSync <span class="grad-text">MCP</span></strong>
    </div>
    <span class="pill" id="pill"></span>
  </div>

  <!-- 2. Top Control & Device Card -->
  <div class="pop-card">
    <!-- Device Info & Last Frame -->
    <div class="pop-device-row">
      <div class="pop-device-badge" id="device-info">
        <svg class="icon-svg-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="14" height="20" x="5" y="2" rx="2" ry="2"/>
          <path d="M12 18h.01"/>
        </svg>
        <span id="device-model">Android Device</span>
        <span class="dot-sep">·</span>
        <span id="device-frames" class="text-highlight">-- frames</span>
      </div>
      <div class="pop-meta" id="meta">Last frame: --</div>
    </div>

    <!-- Quick Actions with modern SVG icons -->
    <div class="pop-actions">
      <button class="btn-icon pop-btn-act" id="qa-shot" data-tooltip="Screenshot">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
          <circle cx="12" cy="13" r="3"/>
        </svg>
      </button>
      <button class="btn-icon pop-btn-act" id="qa-home" data-tooltip="Home">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </button>
      <button class="btn-icon pop-btn-act" id="qa-back" data-tooltip="Back">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </button>
      <button class="btn-icon pop-btn-act" id="qa-copy" data-tooltip="Copy Connect Kit">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="8" height="4" x="8" y="2" rx="1" ry="1"/>
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
          <path d="M9 12h6"/>
          <path d="M9 16h6"/>
        </svg>
      </button>
      <button class="btn-icon pop-btn-act" id="qa-reload" data-tooltip="Reload Extension">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
        </svg>
      </button>
    </div>

    <!-- Navigation buttons -->
    <div class="pop-nav-row">
      <button class="btn btn-primary btn-sm" id="open-side" title="Open Side Panel (Alt+Shift+D)">
        <svg class="icon-svg-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="18" x="3" y="3" rx="2"/>
          <path d="M15 3v18"/>
        </svg>
        Side Panel
      </button>
      <button class="btn btn-ghost btn-sm" id="open" title="Open full tab dashboard">
        <svg class="icon-svg-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="18" x="3" y="3" rx="2"/>
          <path d="M3 9h18"/>
          <path d="M9 21V9"/>
        </svg>
        Dashboard
      </button>
      <button class="btn btn-ghost btn-sm" id="setup">
        <svg class="icon-svg-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        Setup
      </button>
      <span class="version" id="version">v1.1.0</span>
    </div>
  </div>

  <!-- 3. Bottom Section: Live Screen Mirror -->
  <div class="pop-preview-sec">
    <div class="pop-preview-header">
      <span class="preview-title">Live Screen</span>
      <span class="preview-hint">click frame to tap phone</span>
    </div>
    <div class="pop-frame-wrap" id="pop-frame-wrap">
      <div class="frame-empty" id="pop-empty">
        <svg class="icon-svg-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect width="14" height="20" x="5" y="2" rx="2" ry="2"/>
          <path d="M12 18h.01"/>
        </svg>
        <span>Waiting for screen frame…<br>Tap bubble on phone to capture.</span>
      </div>
      <img class="thumb" id="thumb" alt="Latest phone screen" hidden>
      <div class="pop-frame-coords" id="pop-coords">0, 0</div>
    </div>
  </div>
</div>
<script type="module" src="popup.js"></script>
</body>
</html>
