<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles/brand.css">
<link rel="stylesheet" href="../styles/components.css">
<style>body { width: 300px; }</style>
</head>
<body class="popup">
<div class="pop">
  <div class="row spread">
    <strong>ScreenSync <span class="grad-text">MCP</span></strong>
    <span class="pill" id="pill"></span>
  </div>
  <img class="thumb" id="thumb" alt="Latest phone screen" hidden>
  <div class="dim" id="meta" style="font-size:12px"></div>
  <div class="row">
    <button class="btn btn-primary btn-sm" id="open">Open Dashboard</button>
    <button class="btn btn-ghost btn-sm" id="setup">Setup</button>
  </div>
</div>
<script type="module" src="popup.js"></script>
</body>
</html>
