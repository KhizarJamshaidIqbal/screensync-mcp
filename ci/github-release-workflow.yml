# HOW TO ENABLE
# 1. Copy this file to  .github/workflows/release.yml
# 2. Add these repository secrets (Settings > Secrets and variables > Actions):
#      ANDROID_KEYSTORE_BASE64    base64 of android/app/screensync-release.jks
#      ANDROID_STORE_PASSWORD     key.properties storePassword
#      ANDROID_KEY_PASSWORD       key.properties keyPassword
#      ANDROID_KEY_ALIAS          key.properties keyAlias
#      PLAY_SERVICE_ACCOUNT_JSON  Play Console > Setup > API access service account
# 3. It stays here rather than in .github/workflows/ because the push token in
#    use has no 'workflow' scope, and GitHub refuses to create workflow files
#    through it. Moving the file in by hand (or with a scoped token) is enough.
name: Release to Google Play

# Publishing is the CI's job, not a manual trip to the Play Console: bump
# pubspec.yaml, tag, push, and the bundle lands on a Play track by itself.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track (internal, alpha, beta, production)'
        required: true
        default: internal

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # The same upload key the Play Console knows, restored from secrets.
      - name: Restore the upload keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/screensync-release.jks
          cat > android/app/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=screensync-release.jks
          EOF

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Play takes an .aab, not an .apk.
      - name: Build the App Bundle
        run: flutter build appbundle --release

      - name: Upload to Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.screensync.mcp
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed

